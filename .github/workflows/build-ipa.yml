name: Build iPhone app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -version
          set +e
          xcodebuild \
            -project CubicRemote.xcodeproj \
            -target CubicRemote \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
          status=$?
          set -e
          # surface errors as annotations (readable through the GitHub API)
          grep -E "error:|fatal|BUILD FAILED|xcodebuild: error" build.log | sort -u | head -40 | while IFS= read -r line; do
            echo "::error::$line"
          done
          if [ $status -ne 0 ] || [ ! -d build/Release-iphoneos/CubicRemote.app ]; then
            tail -40 build.log | while IFS= read -r line; do echo "::warning::$line"; done
            exit 1
          fi
          echo "BUILD OK"

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/CubicRemote.app Payload/
          zip -qry CubicRemote.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CubicRemote-ipa
          path: CubicRemote.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
