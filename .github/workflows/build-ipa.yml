name: Build iPhone app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -version
          set +e
          xcodebuild \
            -project CubicRemote.xcodeproj \
            -target CubicRemote \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
          status=$?
          set -e
          # surface errors as annotations (readable through the GitHub API)
          grep -E "error:|fatal|BUILD FAILED|xcodebuild: error" build.log | sort -u | head -40 | while IFS= read -r line; do
            echo "::error::$line"
          done
          if [ $status -ne 0 ] || [ ! -f build/Release-iphoneos/CubicRemote.app/CubicRemote ]; then
            tail -40 build.log | while IFS= read -r line; do echo "::warning::$line"; done
            exit 1
          fi
          echo "BUILD OK"

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/CubicRemote.app Payload/
          zip -qry CubicRemote.ipa Payload
          echo "::notice::app contents: $(ls -la Payload/CubicRemote.app | tr '\n' ' ')"
          echo "::notice::binary: $(file Payload/CubicRemote.app/CubicRemote) size $(stat -f%z Payload/CubicRemote.app/CubicRemote)"
          echo "::notice::ipa size $(stat -f%z CubicRemote.ipa)"
          echo "::notice::plist keys: $(plutil -p Payload/CubicRemote.app/Info.plist | tr '\n' ' ' | cut -c1-900)"

      - name: Publish to the "latest" release (easy download on iPhone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest CubicRemote.ipa \
            --title "Cubic Remote（最新版）" \
            --notes "自動編譯於 ${{ github.sha }}。在 iPhone 上下載 CubicRemote.ipa，再用 AltStore 安裝。" \
            --target "${{ github.sha }}"

      - name: Upload IPA
        uses: actions/upload-artifact@v5
        with:
          name: CubicRemote-ipa
          path: CubicRemote.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-log
          path: build.log
